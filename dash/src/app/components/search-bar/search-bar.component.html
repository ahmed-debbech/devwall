<div class="search-element">
  <input #search_term value="{{termInSearch}}" class="form-control" type="search" placeholder="Search" aria-label="Search" data-width="250">
  <button (keyup.enter)="search(search_term.value)" (click)="search(search_term.value)" class="btn" type="submit"><i class="fas fa-search"></i></button>
  <div class="search-backdrop"></div>
  <div class="search-result">
    <div class="search-header">
      Histories
    </div>
    <div *ngFor="let term of terms" class="search-item">
      <a  (click)="search(term)">{{term}}</a>
      <a href="#" (click)="deleteTerm(term)" class="search-close"><i class="fas fa-times"></i></a>
    </div>
    <div *ngIf="terms.length == 0" class="search-item">
      <a class="search-header">No search history yet</a>
    </div>

  </div>
</div>
