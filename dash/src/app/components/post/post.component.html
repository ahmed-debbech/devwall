<div class="row">
    <div class="col-md-2 col-lg-2 col-md-2 col-sm-0"></div>
    <div class="col-md-8 col-lg-8 col-md-8 col-sm-12">
        <div class="card">
            <div class="card-header">
                <h4>Post ID {{post.randomId}}</h4>
            </div>
            <div class="card-body">
                <div class="tickets">

                    <div class="ticket-content">
                        <div class="ticket-header">

                            <div class="ticket-detail">
                                <div class="ticket-title text-primary">
                                    <h4>{{post.title}} </h4>
                                </div>
                                <div class="ticket-info">
                                    <div class="font-weight-600">
                                        <a *ngFor="let tag of post.tags" href="#"
                                            class="m-1 badge badge-light">{{tag.name}}</a>
                                    </div>
                                </div>
                                <div class="ticket-title mt-1 font-weight-600">
          <p>{{mom(parseInt(post.createdAt)).fromNow()}}</p> </div>
                            </div>
                        </div>
                        <div class="ticket-divider"></div>

                        <div class="text-start w-100 ticket-description">
                            <app-markdown [text]="post.body"></app-markdown>

                            <div class="ticket-divider mb-1"></div>

                            <div class="gallery">
                                <a href="#" class="btn btn-light btn-sm mr-1"><i class="fas fa-lightbulb btn-success"></i> Useful
                                    ({{post.useful}})</a>
                                  <a href="#" class="btn btn-light btn-sm"><i class="fas fa-lightbulb btn-danger"></i> Not Useful
                                    ({{post.notUseful}})</a>
                                <a  (click)="copyToCB( post.randomId )" class="btn mr-1 btn-github">
                                    <i class="far fa-paper-plane">{{c}}</i>
                                </a>
                                
                                <div class="w-100 d-sm-none"></div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-2 col-lg-2 col-sm-0">

    </div>
</div>
