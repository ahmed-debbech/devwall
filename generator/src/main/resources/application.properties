spring.application.name=devwall_generator
server.servlet.context-path=/api
server.port=1500
ai.ip=https://duckduckgo.com/duckchat/v1/chat
ai.generate=D

#DB
# PostgreSQL database configuration
spring.datasource.url=jdbc:postgresql://192.168.1.10:5432/devwall?createDatabaseIfNotExist=true
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
org.hibernate.dialect=hibernate.dialect.PostgreSQLDialect

# JPA configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true