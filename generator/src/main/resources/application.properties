spring.application.name=devwall_generator
server.servlet.context-path=/api
server.port=1500
ai.ip=https://openrouter.ai/api/v1/chat/completions
ai.generate=ENABLED

#DB
# PostgreSQL database configuration
spring.datasource.url=jdbc:postgresql://debbech.com:63000/devwall?createDatabaseIfNotExist=true
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
org.hibernate.dialect=hibernate.dialect.PostgreSQLDialect

# JPA configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true